name: Public alpha release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.20.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: test "$(uname -m)" = arm64
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:opencode
      - run: pnpm quality
      - name: Configure isolated Apple signing credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_API_ISSUER APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing required release secret: $name" >&2; exit 1; }
          done

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          certificate_path="$RUNNER_TEMP/uruvam-developer-id.p12"
          keychain_path="$RUNNER_TEMP/uruvam-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          chmod 600 "$api_key_path" "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity" || { echo "Developer ID Application identity was not imported" >&2; exit 1; }
          echo "::add-mask::$identity"
          echo "APPLE_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
      - run: pnpm make
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      - name: Verify signed and stapled application
        run: |
          set -euo pipefail
          app_path="out/Uruvam-darwin-arm64/Uruvam.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
      - run: pnpm release:manifest
      - name: Generate validated CycloneDX SBOM
        run: |
          set -euo pipefail
          pnpm dlx @cyclonedx/cyclonedx-npm@4.2.1 \
            --ignore-npm-errors \
            --validate \
            --output-file out/uruvam.cdx.json \
            2> "$RUNNER_TEMP/cyclonedx.log" || {
              cat "$RUNNER_TEMP/cyclonedx.log" >&2
              exit 1
            }
          node -e 'const bom=require("./out/uruvam.cdx.json"); if(bom.bomFormat!=="CycloneDX"||!Array.isArray(bom.components)||bom.components.length===0) process.exit(1)'
      - name: Generate published-asset checksums
        working-directory: out
        run: shasum -a 256 *.zip *.dmg uruvam.cdx.json latest-mac.yml > SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            out/*.zip
            out/*.dmg
            out/*.json
            out/*.yml
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --generate-notes out/*.zip out/*.dmg out/uruvam.cdx.json out/latest-mac.yml out/SHA256SUMS
        env: { GH_TOKEN: "${{ github.token }}" }
