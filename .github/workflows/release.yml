name: Public alpha release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.20.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: test "$(uname -m)" = arm64
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm make
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: pnpm release:manifest
      - run: pnpm dlx @cyclonedx/cyclonedx-npm@latest --output-file out/uruvam.cdx.json
      - run: find out -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.json' -o -name 'latest-mac.yml' \) -print0 | xargs -0 shasum -a 256 > out/SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with: { subject-path: "out/**/*.{zip,dmg,json}" }
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes out/**/*.zip out/**/*.dmg out/uruvam.cdx.json out/latest-mac.yml out/SHA256SUMS
        env: { GH_TOKEN: "${{ github.token }}" }
